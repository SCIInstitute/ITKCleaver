name: clang-format linter

on:
  push:
    branches:
      - master
    tags:
       - '*'
  pull_request:
    branches:
      - master

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - uses: InsightSoftwareConsortium/ITKClangFormatLinterAction@main
      with:
        itk-branch: main
